# Server Configuration
server.port=${PORT:8080}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ums_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Security)
ums.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
ums.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initial Administrator Seed Configuration
ums.init.admin.email=${INITIAL_ADMIN_EMAIL:admin@test.com}
ums.init.admin.password=${INITIAL_ADMIN_PASSWORD:Admin@123}
ums.init.admin.name=${INITIAL_ADMIN_NAME:System Administrator}

# CORS Allowed Origins
ums.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
